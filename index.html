<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>战斗时间轴 · BetterGI Combat Editor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="editor.css?v=combat-multiplayer-20261022">
  <link rel="stylesheet" href="teams.css?v=combat-teams-20261018">
  <link rel="stylesheet" href="multiplayer.css?v=combat-multiplayer-20261022">
  <link rel="stylesheet" href="tree-editor.css?v=combat-tree-preview-20261023-2">
  <script src="vendor/lucide.min.js" defer></script>
  <script src="vendor/jsep.iife.min.js" defer></script>
  <script src="catalog.js" defer></script>
  <script src="cast-timings.js" defer></script>
  <script src="operations.js?v=combat-formats-20261018" defer></script>
  <script src="strategy-formats.js?v=combat-multiplayer-20261022" defer></script>
  <script src="roles.js?v=combat-formats-20261018" defer></script>
  <script src="conditions.js?v=combat-rules-20261018" defer></script>
  <script src="teams.js?v=combat-multiplayer-20261022" defer></script>
  <script src="multiplayer.js?v=combat-multiplayer-20261022" defer></script>
  <script src="model.js?v=combat-multiplayer-20261022" defer></script>
  <script src="rule-editor.js?v=combat-multiplayer-20261022" defer></script>
  <script src="team-editor.js?v=combat-teams-20261018" defer></script>
  <script src="multiplayer-editor.js?v=combat-multiplayer-20261022" defer></script>
  <script src="tree-model.js?v=combat-tree-preview-20261023" defer></script>
  <script src="tree-editor.js?v=combat-tree-preview-20261023" defer></script>
  <script src="editor.js?v=combat-tree-preview-20261023" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark"><i data-lucide="clapperboard"></i></span>
      <div><h1>战斗时间轴</h1><span class="brand-caption">BetterGI Combat Editor</span></div>
    </div>
    <div id="strategyModeControl" class="segmented strategy-mode" role="group" aria-label="战斗策略格式">
      <button type="button" data-strategy-format="txt" aria-pressed="false" title="TXT 顺序命令策略">TXT</button>
      <button type="button" data-strategy-format="json" class="selected" aria-pressed="true" title="JSON 条件与优先级策略">JSON</button>
    </div>
    <div class="project-heading" id="projectHeading">
      <input id="projectName" aria-label="工程名称" maxlength="80" autocomplete="off">
      <span id="saveState" class="save-state">本地草稿</span>
    </div>
    <nav class="document-actions" aria-label="工程">
      <button class="icon-button" id="newProject" type="button" title="新建工程" aria-label="新建工程"><i data-lucide="file-plus-2"></i></button>
      <button class="icon-button" id="importProject" type="button" title="打开工程、TXT 或 JSON 策略" aria-label="打开工程、TXT 或 JSON 策略"><i data-lucide="folder-open"></i></button>
      <button class="icon-button" id="saveProject" type="button" title="保存工程文件" aria-label="保存工程文件"><i data-lucide="save"></i></button>
      <button class="icon-button" id="showJson" type="button" title="查看策略源码" aria-label="查看策略源码"><i data-lucide="code-xml"></i></button>
      <button class="icon-button" id="jsonGuide" type="button" title="JSON 执行指南" aria-label="JSON 执行指南"><i data-lucide="book-open"></i></button>
      <button class="export-button" id="exportStrategy" type="button"><i data-lucide="download"></i><span>导出战斗 JSON</span></button>
    </nav>
  </header>

  <div class="editing-toolbar">
    <div class="toolbar-group">
      <div id="multiplayerControls" class="multiplayer-controls"></div>
      <div id="teamControls" class="team-controls"></div>
      <button id="libraryToggle" class="panel-toggle" type="button" aria-expanded="false"><i data-lucide="users-round"></i><span>角色</span></button>
      <button id="undo" class="icon-button" type="button" title="撤销" aria-label="撤销" disabled><i data-lucide="undo-2"></i></button>
      <button id="redo" class="icon-button" type="button" title="重做" aria-label="重做" disabled><i data-lucide="redo-2"></i></button>
      <span class="toolbar-divider"></span>
      <button id="snapToggle" class="icon-button selected" type="button" title="吸附刻度" aria-label="吸附刻度" aria-pressed="true"><i data-lucide="magnet"></i></button>
      <select id="snapStep" aria-label="吸附精度">
        <option value="100">0.1 秒</option><option value="500">0.5 秒</option><option value="1000">1 秒</option>
      </select>
      <label class="checkbox-label ripple-label" id="rippleControl"><input id="rippleToggle" type="checkbox" checked><span>联动后续</span></label>
      <select id="executionMode" aria-label="执行方式">
        <option value="process">按步骤推进</option>
        <option value="timeline">按计划时刻</option>
        <option value="original">条件与优先级</option>
      </select>
    </div>
    <div class="toolbar-group zoom-group">
      <button id="zoomOut" class="icon-button" type="button" title="缩小时间轴（-）" aria-label="缩小时间轴"><i data-lucide="zoom-out"></i></button>
      <input id="zoom" type="range" min="8" max="320" step="4" value="48" aria-label="时间轴缩放">
      <button id="zoomIn" class="icon-button" type="button" title="放大时间轴（+）" aria-label="放大时间轴"><i data-lucide="zoom-in"></i></button>
      <button id="fitView" class="icon-button" type="button" title="显示整轮（Ctrl+0）" aria-label="显示整轮"><i data-lucide="scan-line"></i></button>
      <button id="inspectorToggle" class="panel-toggle" type="button" aria-expanded="false"><i data-lucide="sliders-horizontal"></i><span>属性</span></button>
    </div>
  </div>

  <main class="editor-layout">
    <aside class="library-panel side-panel" id="libraryPanel" aria-label="角色库">
      <header class="panel-heading"><h2>角色库</h2><span id="catalogCount" class="muted"></span>
        <button class="icon-button drawer-close" data-close-panel="library" type="button" aria-label="关闭角色库"><i data-lucide="x"></i></button>
      </header>
      <div class="library-tools">
        <label class="search-field"><i data-lucide="search"></i><input id="characterSearch" type="search" placeholder="搜索角色或别名" aria-label="搜索角色或别名"></label>
        <div id="elementFilters" class="element-filters" role="group" aria-label="元素"></div>
        <div class="segmented library-mode" id="libraryMode" role="group" aria-label="拖入的技能类型">
          <button type="button" class="selected" data-mode="skill" aria-pressed="true" title="元素战技">E</button>
          <button type="button" data-mode="burst" aria-pressed="false" title="元素爆发">Q</button>
          <button type="button" data-mode="attack" aria-pressed="false" title="普通攻击"><i data-lucide="swords"></i><span>普攻</span></button>
          <button type="button" data-mode="charge" aria-pressed="false" title="重击"><i data-lucide="sword"></i><span>重击</span></button>
        </div>
      </div>
      <div id="characterList" class="character-list" role="list" aria-label="角色"></div>
      <section class="library-selection" id="librarySelection" aria-label="当前角色技能"></section>
    </aside>

    <section class="workspace" aria-label="战斗排轴">
      <section class="mobile-preview" id="mobilePreview" aria-label="当前动作">
        <div class="mobile-preview-heading"><div id="mobileProjectSlot"></div><div class="mobile-strategy-controls"><div id="mobileFormatSlot"></div><div id="mobileModeSlot"></div></div></div>
        <div id="mobileMultiplayerSlot"></div>
        <div id="mobileTeamSlot"></div>
        <div class="mobile-preview-identity" id="mobilePreviewIdentity"></div>
      </section>
      <header class="transport">
        <div class="playback-controls">
          <button id="play" class="play-button icon-button" type="button" title="播放排轴预览" aria-label="播放排轴预览"><i data-lucide="play"></i></button>
          <button id="stop" class="icon-button" type="button" title="回到起点" aria-label="回到起点"><i data-lucide="square"></i></button>
          <output id="timeReadout" class="time-readout">00:00.0</output>
          <select id="playbackSpeed" aria-label="预览速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
          <span id="cycleReadout" class="cycle-readout">第 1 轮</span>
        </div>
        <div id="timelineViewControl" class="timeline-view-control" role="group" aria-label="编辑器视图">
          <button id="classicView" type="button" data-timeline-view="classic" class="selected" aria-pressed="true" title="经典时间轴" aria-label="经典时间轴"><i data-lucide="layers-3"></i><span>经典</span></button>
          <button id="treeView" type="button" data-timeline-view="tree" aria-pressed="false" title="树状时间轴预览" aria-label="树状时间轴预览"><i data-lucide="workflow"></i><span>树状新版</span></button>
        </div>
        <div id="mobileHistory" class="mobile-history"><div id="mobileUndoSlot"></div><div id="mobileRedoSlot"></div></div>
        <div class="loop-controls">
          <label class="checkbox-label"><input id="repeatToggle" type="checkbox" checked><span id="repeatLabel">循环</span></label>
          <label class="duration-field"><input id="loopDuration" type="number" min="1" step="0.1" aria-label="循环长度"><span id="durationLabel">秒</span></label>
          <button id="fitLoop" class="icon-button" type="button" title="按冷却整理排轴" aria-label="按冷却整理排轴"><i data-lucide="list-restart"></i><span class="mobile-tool-label">整理</span></button>
        </div>
      </header>
      <div class="timeline-legend">
        <span><i class="legend-swatch solid"></i>释放</span>
        <span><i class="legend-swatch idle"></i>站场</span>
        <span><i class="legend-swatch effect"></i>效果</span>
        <span><i class="legend-swatch cooldown"></i>冷却</span>
        <span class="switch-rule"><i data-lucide="timer"></i>换人间隔 1 秒</span>
      </div>
      <div id="timelineScroller" class="timeline-scroller">
        <div id="timelineCanvas" class="timeline-canvas" tabindex="0" aria-label="战斗时间轴"></div>
      </div>
      <footer class="sequence-overview">
        <div class="sequence-heading"><i data-lucide="list-video"></i><span id="sequenceLabel">动作顺序</span></div>
        <div id="sequenceList" class="sequence-list"></div>
      </footer>
    </section>

    <aside class="inspector-panel side-panel" id="inspectorPanel" aria-label="片段属性">
      <header class="panel-heading"><h2 id="inspectorTitle">片段属性</h2>
        <button class="icon-button drawer-close" data-close-panel="inspector" type="button" aria-label="关闭属性"><i data-lucide="x"></i></button>
      </header>
      <div id="inspectorContent" class="inspector-content"></div>
    </aside>
  </main>

  <footer class="app-status">
    <span id="projectStats"></span>
    <button id="validationStatus" type="button" class="validation-status"></button>
    <span class="preview-status"><span class="status-dot"></span><span id="previewStatus">预计排轴</span></span>
  </footer>
  <nav id="mobileTools" class="mobile-tools" aria-label="排轴工具">
    <button id="mobileAdd" type="button" title="添加动作" aria-label="添加动作" aria-expanded="false"><i data-lucide="plus"></i><span>动作</span></button>
    <div id="mobileLibrarySlot"></div>
    <div id="mobileInspectorSlot"></div>
    <div id="mobileFitLoopSlot"></div>
    <button id="mobileAdjust" type="button" title="缩放与吸附" aria-label="缩放与吸附" aria-expanded="false"><i data-lucide="zoom-in"></i><span>缩放</span></button>
  </nav>
  <aside id="mobileAdjustPanel" class="mobile-adjust-panel side-panel" aria-label="缩放与吸附">
    <header class="panel-heading"><h2>时间轴</h2><button class="icon-button" data-close-panel="adjust" type="button" aria-label="关闭缩放与吸附"><i data-lucide="x"></i></button></header>
    <div class="mobile-adjust-content">
      <div class="mobile-zoom-controls"><div id="mobileZoomOutSlot"></div><div id="mobileZoomSlot"></div><div id="mobileZoomInSlot"></div><div id="mobileFitViewSlot"></div></div>
      <div class="mobile-snap-controls"><div id="mobileSnapSlot"></div><div id="mobileStepSlot"></div><div id="mobileRippleSlot"></div></div>
    </div>
  </aside>
  <div id="panelBackdrop" class="panel-backdrop" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="quickAddMenu" class="quick-add-menu" role="dialog" aria-label="快速添加动作" hidden></div>
  <aside id="roleSwitcher" class="role-switcher" role="dialog" aria-label="角色定位与兼容分支" hidden></aside>
  <input id="importInput" type="file" accept=".json,.txt,application/json,text/plain" hidden>

  <dialog id="rulesDialog" class="rules-dialog" aria-labelledby="rulesTitle">
    <header class="dialog-heading"><h2 id="rulesTitle">JSON 触发条件</h2>
      <button class="icon-button" type="button" data-close-dialog="rulesDialog" title="关闭条件编排" aria-label="关闭条件编排"><i data-lucide="x"></i></button></header>
    <nav class="rules-view-tabs" role="tablist" aria-label="JSON 规则视图">
      <button type="button" data-rules-view="edit" role="tab"><i data-lucide="blocks"></i><span>条件编排</span></button>
      <button type="button" data-rules-view="queue" role="tab"><i data-lucide="list-ordered"></i><span>优先级队列</span></button>
      <button type="button" data-rules-view="guide" role="tab"><i data-lucide="book-open"></i><span>执行指南</span></button>
    </nav>
    <div id="ruleEditView" class="rule-edit-view">
      <aside id="conditionLibrary" class="condition-library" aria-label="条件素材库">
        <h3>条件素材</h3>
        <nav id="conditionCategories" class="condition-categories" aria-label="条件分类"></nav>
        <div id="conditionMaterials" class="condition-materials"></div>
      </aside>
      <section class="rule-composition" aria-label="动作触发条件">
        <p id="ruleModeNote" class="rule-mode-note"></p>
        <div id="ruleLanes" class="rule-lanes"></div>
      </section>
    </div>
    <section id="ruleQueueView" class="rule-queue-view" hidden aria-label="全局优先级队列">
      <div class="queue-introduction"><h3 id="queueHeading">全局检查顺序</h3><span id="queueStats"></span>
        <div id="queuePlayerControl"></div>
        <p id="queueDescription">本队列按实际导出 JSON 展开，包含尚未应用的条件修改。运行时先按实际队伍过滤，再从上到下选择第一个成立的条目，执行后回到队首。</p>
        <p id="queueWarning" class="queue-warning"></p></div>
      <ol id="priorityQueue" class="priority-queue"></ol>
    </section>
    <section id="ruleGuideView" class="rule-guide-view" hidden aria-label="JSON 执行指南">
      <nav id="ruleGuideTabs" class="rule-guide-tabs" aria-label="指南章节"></nav>
      <div id="ruleGuideContent" class="rule-guide-content"></div>
    </section>
    <p id="ruleEditorError" class="rule-editor-error" role="alert"></p>
    <footer class="dialog-actions rules-actions"><span id="ruleDraftStatus" role="status"></span>
      <button id="cancelRules" type="button" data-close-dialog="rulesDialog">关闭</button>
      <button id="applyRules" type="button" class="primary"><i data-lucide="check"></i><span>应用条件</span></button></footer>
  </dialog>
  <dialog id="jsonDialog" class="json-dialog">
    <header class="dialog-heading"><h2 id="sourceTitle">战斗 JSON</h2><button class="icon-button" type="button" data-close-dialog="jsonDialog" aria-label="关闭策略源码"><i data-lucide="x"></i></button></header>
    <div class="json-meta"><span id="jsonMode"></span><span id="jsonCount"></span></div>
    <textarea id="jsonText" spellcheck="false" aria-label="战斗策略源码"></textarea>
    <p id="jsonError" class="form-error" role="alert"></p>
    <footer class="dialog-actions">
      <button id="copyJson" type="button"><i data-lucide="copy"></i><span>复制</span></button>
      <button id="applyJson" type="button"><i data-lucide="check"></i><span>应用修改</span></button>
      <button id="downloadJson" class="primary" type="button"><i data-lucide="download"></i><span>下载 JSON</span></button>
    </footer>
  </dialog>
  <dialog id="issuesDialog" class="issues-dialog">
    <header class="dialog-heading"><h2>排轴检查</h2><button class="icon-button" type="button" data-close-dialog="issuesDialog" aria-label="关闭排轴检查"><i data-lucide="x"></i></button></header>
    <div id="issuesList" class="issues-list"></div>
    <footer class="dialog-actions"><button id="repairIssues" class="primary" type="button"><i data-lucide="list-restart"></i><span>整理排轴</span></button></footer>
  </dialog>
  <dialog id="newDialog" class="new-dialog">
    <header class="dialog-heading"><h2>新建工程</h2><button class="icon-button" type="button" data-close-dialog="newDialog" aria-label="关闭新建工程"><i data-lucide="x"></i></button></header>
    <label class="field"><span>工程名称</span><input id="newName" value="新的战斗流程" maxlength="80"></label>
    <label class="field"><span>战斗策略格式</span><select id="newFormat" aria-label="新工程策略格式">
      <option value="txt">TXT · 顺序命令</option><option value="json">JSON · 条件与优先级</option>
    </select></label>
    <div class="new-options">
      <button id="createEmpty" type="button"><i data-lucide="file-plus-2"></i><span>空白工程</span></button>
      <button id="createDemo" type="button"><i data-lucide="users-round"></i><span>雷国示例</span></button>
    </div>
  </dialog>
  <dialog id="playerTextDialog" class="new-dialog">
    <header class="dialog-heading"><h2>导出单端 TXT</h2><button class="icon-button" type="button"
      data-close-dialog="playerTextDialog" aria-label="关闭单端导出"><i data-lucide="x"></i></button></header>
    <label class="field"><span>执行玩家</span><select id="playerTextTarget" aria-label="TXT 执行玩家"></select></label>
    <p class="player-export-note">TXT 仅包含所选玩家和各端通用动作，按参考轴顺序执行。JSON 的条件、优先级和有限重试不会保留。</p>
    <footer class="dialog-actions"><button type="button" data-close-dialog="playerTextDialog">取消</button>
      <button id="confirmPlayerText" class="primary" type="button"><i data-lucide="download"></i><span>导出本端 TXT</span></button></footer>
  </dialog>
</body>
</html>
